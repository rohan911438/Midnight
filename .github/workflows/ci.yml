name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Compact language version 0.31.1
        # `compact compile +VERSION` selects an already-installed toolchain
        # version -- it does not fetch it on demand. Without this step the
        # compile fails with "Couldn't find compiler for
        # x86_64-unknown-linux-musl (0.31.1)" (confirmed by reproducing this
        # job's steps locally).
        run: compact update 0.31.1
      - name: Compile hidden-order.compact
        run: compact compile +0.31.1 contracts/hidden-order.compact contracts/build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
